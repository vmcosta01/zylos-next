[package]
name = "zylos-agent-shield"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Security layer for zylos-gateway: PII detection, credential masking, outbound filtering, and audit logging"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }