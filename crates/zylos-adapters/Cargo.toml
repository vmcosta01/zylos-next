[package]
name = "zylos-adapters"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Multi-framework agent adapters: ADK, Claude SDK, CrewAI, LangGraph, LlamaIndex"

[dependencies]
zylos-agent-shield = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
