[package]
name = "zylos-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri v2 desktop shell for zylos-gateway — native window, tray, auto-update, deep links"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "5"
serde_urlencoded = { workspace = true }

# Tauri v2 — optional so the crate compiles in CI without a GUI toolkit
[dependencies.tauri]
version = "2"
optional = true
features = ["tray-icon"]

[dependencies.tauri-plugin-shell]
version = "2"
optional = true

[features]
default = []
gui = ["dep:tauri", "dep:tauri-plugin-shell"]

[dev-dependencies]
tempfile = { workspace = true }