[package]
name = "zylos-memory-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
qdrant = ["dep:qdrant-client"]
lancedb = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:tokio-stream"]

[dependencies]
zylos-core = { workspace = true }
tokio = { workspace = true, features = ["full", "sync", "rt-multi-thread", "macros", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
petgraph = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
async-trait = "0.1"
tokio-util = "0.7"
dashmap = "6"

# Optional vector store backends
qdrant-client = { version = "1", optional = true }
lancedb = { version = "0.15", optional = true }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }
tokio-stream = { version = "0.1", optional = true }
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "memory_system"
harness = false

[lints]
workspace = true
