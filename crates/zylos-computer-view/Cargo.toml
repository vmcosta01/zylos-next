[package]
name = "zylos-computer-view"
version = "0.1.0"
edition = "2021"
description = "Computer View Panel para Zylos Cockpit v2 — proxy VNC/WebSocket para visualização remota de desktop do agente"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
dashmap = "6"

[dev-dependencies]
