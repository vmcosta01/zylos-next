[package]
name = "zylos-browser-takeover"
version = "0.1.0"
edition = "2021"
description = "Browser takeover console for zylos-gateway — live CDP proxy, session handoff, and audit recording"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }