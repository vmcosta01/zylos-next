[package]
name = "zylos-personalities"
version = "0.1.0"
edition = "2021"
description = "Personality-driven agent identities with division taxonomy for zylos-gateway"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"