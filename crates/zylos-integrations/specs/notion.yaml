slug: notion
display_name: Notion
auth_url: https://api.notion.com/v1/oauth/authorize
token_url: https://api.notion.com/v1/oauth/token
client_id: "${NOTION_CLIENT_ID}"
client_secret: "${NOTION_CLIENT_SECRET}"
redirect_uri: http://localhost:9090/callback/notion
scopes: []
requires_approval: false
rate_limit_rpm: 30
actions:
  - id: search_pages
    description: Search for pages and databases
    method: POST
    url_template: https://api.notion.com/v1/search
    requires_approval: false
    body_schema:
      type: object
      properties:
        query: { type: string }
        filter: { type: object }
        page_size: { type: integer, default: 10 }

  - id: create_page
    description: Create a new page in a database or workspace
    method: POST
    url_template: https://api.notion.com/v1/pages
    requires_approval: true
    body_schema:
      type: object
      required: [parent, properties]
      properties:
        parent: { type: object }
        properties: { type: object }
        children: { type: array }

  - id: update_page
    description: Update page properties
    method: PATCH
    url_template: https://api.notion.com/v1/pages/{page_id}
    requires_approval: false

  - id: query_database
    description: Query a database with filters and sorts
    method: POST
    url_template: https://api.notion.com/v1/databases/{database_id}/query
    requires_approval: false

  - id: append_block_children
    description: Append content blocks to a page
    method: PATCH
    url_template: https://api.notion.com/v1/blocks/{block_id}/children
    requires_approval: false