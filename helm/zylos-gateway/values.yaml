replicaCount: 1

image:
  repository: vmcosta/zylos-gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: zylos-gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Network Policy
networkPolicy:
  enabled: true
  allowAllEgress: false
  allowedEgressCIDRs:
    - "0.0.0.0/0"  # Allow HTTPS outbound; restrict in production

# Monitoring & Observability
monitoring:
  serviceMonitor:
    enabled: true
    scrapeInterval: "15s"
    scrapeTimeout: "10s"
    additionalLabels: {}
    namespace: ""
  grafanaDashboard:
    enabled: true

# Autoscaling custom metrics
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  scaleUpStabilization: 60
  scaleDownStabilization: 300
  customMetrics:
    enabled: true
    targetActiveAgents: "20"
    targetQueueDepth: "50"

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

logLevel: info
