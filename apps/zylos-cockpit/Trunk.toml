[build]
target = "index.html"
dist = "dist"

[[hooks]]
stage = "pre_build"
command = "rustup"
command_arguments = ["target", "add", "wasm32-unknown-unknown"]

# O wasm-opt roda pelo próprio Trunk (`data-wasm-opt="z"` no index.html). Um hook post_build com
# comando do Windows quebrava o build no CI (Linux); o hook antigo ainda passava `$WASM_FILE`
# literal, que o Trunk não expande.

[tools]

# Assets estáticos (sw.js, manifest.json, robots.txt, _headers, icons/) são copiados
# via <link data-trunk rel="copy-file|copy-dir"> no index.html — o Trunk 0.22 não
# suporta [[copy]] (era ignorado silenciosamente; ver T11.5.1 baseline).

[serve]
port = 3000
open = false

[watch]
ignore = ["dist"]