[build]
target = "index.html"
dist = "dist"

[[hooks]]
stage = "pre_build"
command = "rustup"
command_arguments = ["target", "add", "wasm32-unknown-unknown"]

[tools]

[[copy]]
from = "sw.js"
to = "sw.js"

[[copy]]
from = "manifest.json"
to = "manifest.json"

[serve]
port = 3000
open = false

[watch]
ignore = ["dist"]