[build]
target = "index.html"
dist = "dist"

[[hooks]]
stage = "pre_build"
command = "rustup"
command_arguments = ["target", "add", "wasm32-unknown-unknown"]

# wasm-opt hook: otimiza o bundle WASM com flags agressivos
# binaryen version_121 instalado em $LOCALAPPDATA/Temp/binaryen-version_121/bin/
[[hooks]]
stage = "post_build"
command = "C:\\Users\\Paulo\\AppData\\Local\\Temp\\binaryen-version_121\\bin\\wasm-opt.exe"
command_arguments = ["-Oz", "--strip-debug", "--strip-producers", "$WASM_FILE", "-o", "$WASM_FILE"]

[tools]

# Assets estáticos (sw.js, manifest.json, robots.txt, _headers, icons/) são copiados
# via <link data-trunk rel="copy-file|copy-dir"> no index.html — o Trunk 0.22 não
# suporta [[copy]] (era ignorado silenciosamente; ver T11.5.1 baseline).

[serve]
port = 3000
open = false

[watch]
ignore = ["dist"]