[package]
name = "zylos-cockpit"
version = "0.1.0"
edition = "2021"
description = "Zylos-Next Cockpit — Leptos WASM frontend (ADR-042)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr", "ssr", "hydrate"] }
leptos_router = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console", "Request", "RequestInit", "Response", "Storage", "DomTokenList", "HtmlInputElement", "Event", "EventSource", "MessageEvent", "Location"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ssr", "hydrate"))'] }
