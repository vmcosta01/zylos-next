[package]
name = "zylos-cockpit"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Zylos-Next Cockpit — Leptos WASM frontend (ADR-042)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console", "Request", "RequestInit", "Response", "Storage", "DomTokenList", "HtmlInputElement", "Event", "EventSource", "MessageEvent", "Location", "MouseEvent", "SvgElement", "SvgGraphicsElement", "SvgCircleElement", "SvgLineElement", "SvgTextElement", "SvgsvgElement", "DomRect", "WheelEvent", "KeyboardEvent", "WebSocket", "BinaryType", "HtmlTextAreaElement", "Navigator", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "AudioContext", "BaseAudioContext", "AudioNode", "AnalyserNode", "MediaStreamAudioSourceNode", "SpeechSynthesis", "SpeechSynthesisUtterance"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
yrs = { workspace = true, features = ["sync"] }

# Build WASM (Trunk) usa só `csr`. `ssr`/`hydrate` ficam opt-in: ligar os três
# juntos inflava o .wasm com código de servidor/hidratação nunca usado no CSR.
[features]
default = []
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
