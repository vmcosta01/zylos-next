<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zylos Cockpit</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="Multi-agent orchestration dashboard for Zylos-Next">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        /* Critical CSS for fast first paint — rest loaded via WASM */
        body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .loading { text-align: center; opacity: 0.7; }
        .loading h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .loading p { font-size: 0.875rem; }
        @media (prefers-color-scheme: light) {
            body { background: #f8fafc; color: #1e293b; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <h1>Zylos Cockpit</h1>
            <p>Carregando…</p>
        </div>
    </div>
    <script type="module">
        // Register service worker for PWA offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('[PWA] SW registered:', reg.scope))
                    .catch((err) => console.warn('[PWA] SW registration failed:', err));
            });
        }

        // Request background sync permission for offline queue replay
        if ('serviceWorker' in navigator && 'sync' in window.SyncManager.prototype) {
            navigator.serviceWorker.ready.then((reg) => {
                return reg.sync.register('zylos-replay-queue');
            }).catch(() => { /* Background sync not supported */ });
        }
    </script>
</body>
</html>
