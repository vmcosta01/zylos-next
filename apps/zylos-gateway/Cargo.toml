[package]
name = "zylos-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "zylos_gateway"
path = "src/lib.rs"

[[bin]]
name = "zylos-gateway"
path = "src/main.rs"

[dependencies]
zylos-memory-system = { workspace = true }
zylos-live-comm = { workspace = true }
zylos-verification = { workspace = true }
zylos-skills = { workspace = true }
zylos-soar = { path = "../../crates/zylos-soar" }
zylos-adapters = { workspace = true }
zylos-memory-sync = { workspace = true }
zylos-agent-shield = { workspace = true }
zylos-personalities = { workspace = true }
zylos-swarm-orchestrator = { workspace = true }
zylos-evidence-ledger = { workspace = true }
zylos-browser-takeover = { workspace = true }
zylos-goals = { workspace = true }
zylos-pensar = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio-util = "0.7"
toml = "0.8"

dashmap = "6.2.1"
futures-util = "0.3"
yrs = { workspace = true, features = ["sync"] }
zylos-channels = { path = "../../crates/zylos-channels" }
zylos-auth = { path = "../../crates/zylos-auth" }
zylos-analytics = { path = "../../crates/zylos-analytics" }
zylos-computer-view = { version = "0.1.0", path = "../../crates/zylos-computer-view" }
zylos-approval = { path = "../../crates/zylos-approval" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
sentry = { version = "0.46.2", features = ["backtrace", "contexts", "panic", "log"] }
zylos-sentinel = { version = "0.1.0", path = "../../crates/zylos-sentinel" }
zylos-integrations = { path = "../../crates/zylos-integrations" }
serde_yaml = "0.9.34"
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = "0.24"
