[package]
name = "zylos-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "zylos_gateway"
path = "src/lib.rs"

[[bin]]
name = "zylos-gateway"
path = "src/main.rs"

[dependencies]
zylos-core = { workspace = true }
zylos-bot-system = { workspace = true }
zylos-memory-system = { workspace = true }
zylos-live-comm = { workspace = true }
zylos-verification = { workspace = true }
zylos-sandbox = { workspace = true }
zylos-skills = { workspace = true }
zylos-soar = { path = "../../crates/zylos-soar" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio-util = "0.7"
toml = "0.8"
jsonwebtoken = "9"
tower_governor = "0.4"
governor = "0.7"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.1"
