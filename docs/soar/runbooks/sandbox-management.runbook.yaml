---
metadata:
  name: sandbox-management
  version: "1.0"
  trigger: "sandbox_spawn OR sandbox_health_degraded"
  audience: ["dev_pleno", "dev_senior", "sre"]
  estimated_duration_minutes: 10
  tags: ["sandbox", "wasm", "docker", "security"]
  related_playbooks:
    - "../playbooks/security-incident-response.md"
  playbook_ref: "../../playbooks/deploy-release.md"
  runbook_refs:
    []

preconditions:
  - check: "WASM runtime available"
    command: "cargo build -p zylos-sandbox 2>&1 | tail -1"
    expected: "exit_code:0"
    on_failure: "abort"
  - check: "Docker daemon running"
    command: "docker info >/dev/null 2>&1 && echo ok || echo skip"
    expected: "ok|skip"
    on_failure: "warn"

steps:
  - id: "check_sandbox_pool"
    action: "execute"
    command: "cargo run -p zylos-sandbox --bin pool-status"
    timeout_seconds: 30
    on_success: "validate_isolation"
    on_failure: "spawn_new"
  - id: "validate_isolation"
    action: "validate"
    command: "cargo run -p zylos-sandbox --bin verify-isolation"
    expected: "exit_code:0"
    timeout_seconds: 30
  - id: "spawn_new"
    action: "execute"
    command: "cargo run -p zylos-sandbox --bin spawn -- --type wasm --timeout 300"
    timeout_seconds: 60
    human_approval_required: false
    on_success: "validate_isolation"
  - id: "cleanup_stale"
    action: "execute"
    command: "cargo run -p zylos-sandbox --bin cleanup -- --older-than 3600"
    timeout_seconds: 60

validation:
  - check: "No sandbox escapes detected"
    command: "cargo run -p zylos-sandbox --bin audit-escapes"
    expected: "exit_code:0"
  - check: "Resource limits enforced"
    command: "cargo run -p zylos-sandbox --bin check-limits"
    expected: "exit_code:0"

rollback:
  - id: "kill_all_sandboxes"
    action: "execute"
    command: "cargo run -p zylos-sandbox --bin kill-all -- --force"
  - id: "purge_wasm_cache"
    action: "execute"
    command: "rm -rf ~/.local/share/zylos/sandbox/cache/*"

escalation:
  max_retries: 2
  escalation_path:
    - level: "sre"
      contact: "#zylos-infra Slack"
      timeout_minutes: 5
    - level: "tech_lead"
      contact: "#zylos-emergency Slack"
      timeout_minutes: 15

audit:
  log_level: "info"
  capture_output: true
  immutable_log: true
