# Runbook Executável: Forensic Evidence Collection

metadata:
  name: "forensic-evidence-collection"
  version: "1.0"
  trigger: "soar_wf001_forensics_phase OR manual_forensics_requested"
  audience: ["dev_senior", "sre", "security_engineer"]
  estimated_duration_minutes: 30
  tags: ["forensics", "evidence", "compliance", "soar-executable"]
  related_playbooks:
    - "../playbooks/security-incident-response.md"
    - "../playbooks/disaster-recovery.md"
  playbook_ref: "../../playbooks/evidence-chain-of-custody.md"
  runbook_refs:
    - "../../runbooks/evidence-ledger.md"
    - "../../runbooks/proof-verification.md"

preconditions:
  - check: "Evidence directory writable"
    command: "mkdir -p /evidence/$(date +%Y%m%d-%H%M%S) && echo ok"
    expected: "ok"
    on_failure: "abort"
  - check: "Running as root or with sudo"
    command: "id -u"
    expected: "0"
    on_failure: "warn"
  - check: "Disk space > 10GB for evidence"
    command: "df -BG /evidence | tail -1 | awk '{print $4}' | tr -d G"
    expected: ">10"
    on_failure: "abort"

steps:
  - id: "create_evidence_dir"
    action: "execute"
    command: "EVIDENCE_DIR=/evidence/$(date +%Y%m%d-%H%M%S)-$$ && mkdir -p $EVIDENCE_DIR && echo $EVIDENCE_DIR > /tmp/zylos-evidence-dir.txt"
    timeout_seconds: 10
    on_success: "collect_memory"

  - id: "collect_memory"
    action: "execute"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && dd if=/dev/mem of=$EVIDENCE_DIR/memory.raw bs=1M count=4096 2>/dev/null; sha256sum $EVIDENCE_DIR/memory.raw > $EVIDENCE_DIR/memory.sha256"
    timeout_seconds: 300
    human_approval_required: true
    on_success: "collect_processes"
    on_failure: "collect_processes"

  - id: "collect_processes"
    action: "execute"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && ps auxf > $EVIDENCE_DIR/processes.txt && ss -tlnp > $EVIDENCE_DIR/network-listeners.txt && ss -tnp > $EVIDENCE_DIR/network-connections.txt"
    timeout_seconds: 30
    on_success: "collect_logs"

  - id: "collect_logs"
    action: "execute"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && cp -a ~/.local/share/zylos/logs/ $EVIDENCE_DIR/zylos-logs/ 2>/dev/null; journalctl --no-pager > $EVIDENCE_DIR/journalctl-full.txt 2>/dev/null"
    timeout_seconds: 60
    on_success: "hash_all_artifacts"

  - id: "hash_all_artifacts"
    action: "execute"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && find $EVIDENCE_DIR -type f ! -name '*.sha256' -exec sha256sum {} \\; > $EVIDENCE_DIR/all-hashes.sha256"
    timeout_seconds: 60
    on_success: "register_evidence"

  - id: "register_evidence"
    action: "execute"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && echo \"SOAR INFO: Evidence collected at $EVIDENCE_DIR. Hash manifest: $EVIDENCE_DIR/all-hashes.sha256\""
    timeout_seconds: 10
    on_success: "validate_final"

  - id: "validate_final"
    action: "validate"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && test -f $EVIDENCE_DIR/all-hashes.sha256 && wc -l < $EVIDENCE_DIR/all-hashes.sha256"
    expected: ">0"
    timeout_seconds: 10

validation:
  - check: "Evidence directory exists and is non-empty"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && test -d $EVIDENCE_DIR && ls $EVIDENCE_DIR | wc -l"
    expected: ">3"
  - check: "Hash manifest exists"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && test -f $EVIDENCE_DIR/all-hashes.sha256"
    expected: "exit_code:0"
  - check: "Memory dump captured (if approved)"
    command: "EVIDENCE_DIR=$(cat /tmp/zylos-evidence-dir.txt) && test -f $EVIDENCE_DIR/memory.raw || echo 'skipped'"
    expected: "exit_code:0"

rollback:
  - id: "preserve_evidence_do_not_delete"
    action: "notify"
    command: "echo 'WARNING: Forensic evidence must NEVER be deleted during rollback. Preserve chain of custody.'"
    timeout_seconds: 5

escalation:
  max_retries: 1
  escalation_path:
    - level: "security_engineer"
      contact: "#zylos-security Slack"
      timeout_minutes: 5
    - level: "tech_lead"
      contact: "#zylos-emergency Slack"
      timeout_minutes: 15

audit:
  log_level: "debug"
  capture_output: true
  immutable_log: true