---
metadata:
  name: skills-registry
  version: "1.0"
  trigger: "skill_registered OR skill_eval_failed"
  audience: ["dev_pleno", "dev_senior"]
  estimated_duration_minutes: 15
  tags: ["skills", "registry", "eval"]
  related_playbooks:
    - "../playbooks/onboarding-devs.md"
  playbook_ref: "../../playbooks/workflow-orchestration.md"
  runbook_refs:
    - "../../runbooks/web-research-adapters.md"
    - "../../runbooks/finance-csv-skill.md"

preconditions:
  - check: "Skills crate compiled"
    command: "cargo build -p zylos-skills 2>&1 | tail -1"
    expected: "exit_code:0"
    on_failure: "abort"

steps:
  - id: "list_skills"
    action: "execute"
    command: "cargo run -p zylos-skills --bin registry -- list"
    timeout_seconds: 30
    on_success: "validate_schema"
  - id: "validate_schema"
    action: "validate"
    command: "cargo run -p zylos-skills --bin registry -- validate-all"
    expected: "exit_code:0"
    timeout_seconds: 60
    on_success: "run_evals"
    on_failure: "quarantine_invalid"
  - id: "run_evals"
    action: "execute"
    command: "cargo run -p zylos-skills --bin eval-runner -- --all"
    timeout_seconds: 300
    human_approval_required: false
    on_success: "publish_results"
    on_failure: "flag_debt"
  - id: "quarantine_invalid"
    action: "execute"
    command: "cargo run -p zylos-skills --bin registry -- quarantine-invalid"
    timeout_seconds: 30
  - id: "flag_debt"
    action: "notify"
    command: "cargo run -p zylos-skills --bin debt-report -- --format json > /tmp/skill-debt.json"
  - id: "publish_results"
    action: "execute"
    command: "cargo run -p zylos-skills --bin export -- --output ~/.local/share/zylos/skills/catalog.json"

validation:
  - check: "All skills have valid schema"
    command: "cargo run -p zylos-skills --bin registry -- validate-all"
    expected: "exit_code:0"
  - check: "Eval pass rate ≥80%"
    command: "cargo run -p zylos-skills --bin eval-summary -- --min-pass-rate 80"
    expected: "exit_code:0"

rollback:
  - id: "restore_previous_catalog"
    action: "execute"
    command: "cp ~/.local/share/zylos/skills/catalog.json.bak ~/.local/share/zylos/skills/catalog.json"

escalation:
  max_retries: 2
  escalation_path:
    - level: "dev_senior"
      contact: "#zylos-devs Slack"
      timeout_minutes: 15

audit:
  log_level: "info"
  capture_output: true
  immutable_log: true
