# Zylos Gateway — reverse proxy nginx (T11.4.3)
# Alternativa ao Caddyfile. TLS via certbot (Let's Encrypt), HTTP/2, SSE e WebSocket.
# Instalação: /etc/nginx/sites-available/zylos-gateway.conf (+ symlink em sites-enabled)
# Validação: nginx -t
# Substitua gateway.zylos.example pelo domínio real.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zylos_gateway {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gateway.zylos.example;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gateway.zylos.example;

    ssl_certificate     /etc/letsencrypt/live/gateway.zylos.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.zylos.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ZylosTLS:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 10m;
    access_log /var/log/nginx/zylos-gateway.access.log;
    error_log  /var/log/nginx/zylos-gateway.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location = /api/v1/health {
        access_log off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_pass http://zylos_gateway;
    }

    location = /api/v1/cockpit/health {
        access_log off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_pass http://zylos_gateway;
    }

    # SSE: sem buffering, conexão longa
    location = /api/v1/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        proxy_pass http://zylos_gateway;
    }

    # WebSocket: upgrade explícito
    location /ws/ {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass http://zylos_gateway;
    }

    location /api/ {
        proxy_read_timeout 60s;
        proxy_pass http://zylos_gateway;
    }

    location / { return 404; }
}
