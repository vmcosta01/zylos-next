name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  msrv:
    name: MSRV Check (Rust 1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy, test, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  # === Fase 11.3: WASM Build + E2E + Size Check ===

  wasm-build:
    name: WASM Build (Cockpit)
    runs-on: ubuntu-latest
    needs: [check, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: taiki-e/install-action@trunk
      - name: Install wasm-opt dependencies
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build cockpit WASM (release)
        working-directory: apps/zylos-cockpit
        run: trunk build --release
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-wasm
          path: apps/zylos-cockpit/dist/
          retention-days: 7

  wasm-size-check:
    name: WASM Size Check (<5MB gzipped)
    runs-on: ubuntu-latest
    needs: [wasm-build]
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: cockpit-wasm
          path: dist/
      - name: Check WASM size
        run: |
          WASM_FILE=$(ls dist/*_bg.wasm | head -1)
          RAW_SIZE=$(wc -c < "$WASM_FILE")
          GZ_SIZE=$(gzip -c "$WASM_FILE" | wc -c)
          RAW_MB=$(echo "scale=2; $RAW_SIZE / 1048576" | bc)
          GZ_MB=$(echo "scale=2; $GZ_SIZE / 1048576" | bc)
          echo "WASM raw: ${RAW_MB} MB (${RAW_SIZE} bytes)"
          echo "WASM gzipped: ${GZ_MB} MB (${GZ_SIZE} bytes)"
          if [ "$GZ_SIZE" -gt 5242880 ]; then
            echo "::error::WASM gzipped size ${GZ_MB}MB exceeds 5MB limit"
            exit 1
          fi
          echo "WASM size check passed: ${GZ_MB}MB gzipped (< 5MB)"

  e2e-tests:
    name: E2E Tests (Chrome Headless)
    runs-on: ubuntu-latest
    needs: [wasm-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack
      - name: Setup Chrome for headless testing
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run E2E tests (headless Chrome)
        working-directory: apps/zylos-cockpit
        run: wasm-pack test --headless --chrome
        timeout-minutes: 10