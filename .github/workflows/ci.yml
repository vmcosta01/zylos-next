name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS: "-Dwarnings"  # Temporarily disabled to batch-fix all warnings in one CI pass

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - run: cargo check --workspace --all-targets --exclude zylos-desktop --exclude zylos-desktop-app

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - run: cargo clippy --workspace --all-targets --exclude zylos-desktop --exclude zylos-desktop-app

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - run: cargo test --workspace --all-features --exclude zylos-desktop --exclude zylos-desktop-app
        env:
          RUSTFLAGS: "--cap-lints warn"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - run: cargo doc --workspace --no-deps --document-private-items --exclude zylos-desktop --exclude zylos-desktop-app
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --exclude zylos-desktop --exclude zylos-desktop-app
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run security audit (non-blocking)
        run: cargo audit || echo "::warning::cargo audit found advisories — review manually"

  msrv:
    name: MSRV Check (Rust 1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - run: cargo check --workspace --all-targets --exclude zylos-desktop --exclude zylos-desktop-app

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy, test, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (GTK/GLib for desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev protobuf-compiler libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev
      - run: cargo build --workspace --release --exclude zylos-desktop --exclude zylos-desktop-app

  # === Fase 11.3: WASM Build + E2E + Size Check ===

  wasm-build:
    name: WASM Build (Cockpit)
    runs-on: ubuntu-latest
    needs: [check, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: taiki-e/install-action@trunk
      - name: Install wasm-opt dependencies
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build cockpit WASM (release)
        working-directory: apps/zylos-cockpit
        run: trunk build --release
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-wasm
          path: apps/zylos-cockpit/dist/
          retention-days: 7

  wasm-size-check:
    name: WASM Size Check (<5MB gzipped)
    runs-on: ubuntu-latest
    needs: [wasm-build]
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: cockpit-wasm
          path: dist/
      - name: Check WASM size
        run: |
          WASM_FILE=$(ls dist/*_bg.wasm | head -1)
          RAW_SIZE=$(wc -c < "$WASM_FILE")
          GZ_SIZE=$(gzip -c "$WASM_FILE" | wc -c)
          RAW_MB=$(echo "scale=2; $RAW_SIZE / 1048576" | bc)
          GZ_MB=$(echo "scale=2; $GZ_SIZE / 1048576" | bc)
          echo "WASM raw: ${RAW_MB} MB (${RAW_SIZE} bytes)"
          echo "WASM gzipped: ${GZ_MB} MB (${GZ_SIZE} bytes)"
          if [ "$GZ_SIZE" -gt 5242880 ]; then
            echo "::error::WASM gzipped size ${GZ_MB}MB exceeds 5MB limit"
            exit 1
          fi
          echo "WASM size check passed: ${GZ_MB}MB gzipped (< 5MB)"

  e2e-tests:
    name: E2E Tests (Chrome Headless)
    runs-on: ubuntu-latest
    needs: [wasm-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack
      - name: Setup Chrome for headless testing
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run E2E tests (headless Chrome)
        working-directory: apps/zylos-cockpit
        env:
          # T11.2.4: timeout por teste de 300s (wasm-bindgen-test-runner; default 20s).
          # wasm-bindgen-test 0.3.80 não aceita `#[wasm_bindgen_test(timeout = N)]`
          # (o macro só reconhece async/crate/unsupported), então o limite é global via env.
          WASM_BINDGEN_TEST_TIMEOUT: "300"
        run: wasm-pack test --headless --chrome
        timeout-minutes: 15