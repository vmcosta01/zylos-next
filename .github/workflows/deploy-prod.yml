name: Deploy Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run all tests
        run: cargo test --workspace --all-features
      - name: Install trunk
        uses: taiki-e/install-action@trunk
      - name: Install wasm-opt dependencies
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build cockpit WASM (release)
        working-directory: apps/zylos-cockpit
        run: trunk build --release
      - name: Validate WASM size (<5MB gzipped)
        run: |
          WASM_FILE=$(ls apps/zylos-cockpit/dist/*_bg.wasm | head -1)
          GZ_SIZE=$(gzip -c "$WASM_FILE" | wc -c)
          GZ_MB=$(echo "scale=2; $GZ_SIZE / 1048576" | bc)
          echo "WASM gzipped: ${GZ_MB} MB"
          if [ "$GZ_SIZE" -gt 5242880 ]; then
            echo "::error::WASM gzipped size ${GZ_MB}MB exceeds 5MB limit"
            exit 1
          fi
      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack
      - name: Setup Chrome for headless testing
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run E2E tests (headless Chrome)
        working-directory: apps/zylos-cockpit
        run: wasm-pack test --headless --chrome
        timeout-minutes: 10
      - name: Upload production WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-production-${{ github.ref_name }}
          path: apps/zylos-cockpit/dist/
          retention-days: 90

  deploy-production:
    name: Deploy to Cloudflare Pages (Production)
    runs-on: ubuntu-latest
    needs: [validate]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Download production WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: cockpit-production-${{ github.ref_name }}
          path: dist/
      - name: Deploy to Cloudflare Pages (Production)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zylos-cockpit --branch=main

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Notes
        id: notes
        run: |
          echo "## Cockpit Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "**Preview URL:** ${{ needs.deploy-production.outputs.preview-url }}" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Changes" >> release-notes.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --oneline >> release-notes.md || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cockpit ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}